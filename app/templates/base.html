<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="{% block description %}Ymmo, le réseau immobilier : achat et vente de biens résidentiels et professionnels.{% endblock %}">
  <title>{% block title %}Ymmo{% endblock %} · Ymmo</title>
  <link rel="stylesheet" href="{{ url_for('static', path='css/main.css') }}">
</head>
<body>
  <a class="skip-link" href="#main">Aller au contenu principal</a>
  <header class="site-header" role="banner">
    <div class="container">
      <a class="brand" href="/">Ymmo</a>
    </div>
  </header>

  <main id="main" class="container" tabindex="-1">
    {% block content %}{% endblock %}
  </main>

  <footer class="site-footer" role="contentinfo">
    <div class="container">
      <p>&copy; Ymmo · Siège à Aix-en-Provence · 12 agences en France</p>
    </div>
  </footer>
</body>
</html>
