name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: Lint (ruff)
        run: ruff check .
      - name: Format check (black)
        run: black --check .
      - name: Tests (pytest, SQLite + PostgreSQL views)
        env:
          TEST_POSTGRES_URL: postgresql+psycopg://ymmo:ymmo@localhost:5432/ymmo_test
        run: pytest --cov=app --cov=analytics --cov-report=term-missing

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ymmo
          POSTGRES_PASSWORD: ymmo
          POSTGRES_DB: ymmo
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ymmo" --health-interval 5s --health-timeout 3s
          --health-retries 10
